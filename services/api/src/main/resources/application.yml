server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        default_schema: gestor_tareas
  flyway:
    enabled: true
    schemas: gestor_tareas
    baseline-on-migrate: true
    locations: classpath:db/migration

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:miClaveSecretaMuySeguraParaFirmarTokensJWT1234567890CambiarEnProduccion}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}  # 15 minutos en ms
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 días en ms
