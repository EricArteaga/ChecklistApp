spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
        # ⚠️ Anular default_schema de producción para H2
        default_schema: public

  sql:
    init:
      mode: never

  # ✅ Deshabilitar Flyway para tests - H2 no soporta sintaxis PL/pgSQL de PostgreSQL
  flyway:
    enabled: false

  h2:
    console:
      enabled: false

logging:
  level:
    com.example.checklistapp: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
